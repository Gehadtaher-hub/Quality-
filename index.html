<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c5c">
  <meta name="description" content="منصة إدارة ومتابعة خارطة طريق الاعتماد والجودة بكلية الحاسبات والمعلومات">
  <title>منصة الاعتماد والجودة | كلية الحاسبات والمعلومات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">ج</div>
        <div>
          <h2>جامعة قناة السويس</h2>
          <small>كلية الحاسبات والمعلومات</small>
        </div>
      </div>

      <hr>

      <nav id="nav" aria-label="أقسام المنصة">
        <button type="button" data-page="dashboard" class="active" aria-current="page">
          <span aria-hidden="true">▦</span><span>لوحة الجاهزية</span>
        </button>
        <button type="button" data-page="roadmap">
          <span aria-hidden="true">⌁</span><span>خارطة الطريق</span>
        </button>
        <button type="button" data-page="tasks">
          <span aria-hidden="true">✓</span><span>المهام</span>
        </button>
        <button type="button" data-page="evidence">
          <span aria-hidden="true">▤</span><span>الأدلة</span>
        </button>
        <button type="button" data-page="reports">
          <span aria-hidden="true">▥</span><span>التقارير</span>
        </button>
        <button type="button" data-page="settings">
          <span aria-hidden="true">⚙</span><span>الاستيراد والنسخ الاحتياطي</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="storageStatus">البيانات محفوظة محليًا</span>
        <small>الإصدار 3.1</small>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="topbar-title">
          <button id="menuToggle" type="button" aria-label="فتح أو إغلاق القائمة" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div>
            <h1 id="pageTitle">لوحة الجاهزية</h1>
            <p id="pageSubtitle">متابعة مؤشرات الاعتماد وتقدم التنفيذ</p>
          </div>
        </div>

        <div class="topbar-actions">
          <label class="quick-import" for="excelFile" title="استيراد خطة الاعتماد من Excel">
            <span aria-hidden="true">↑</span>
            <span>استيراد Excel</span>
          </label>
          <input id="excelFile" type="file" accept=".xlsx,.xls" hidden>
          <button id="notificationsBtn" type="button" aria-label="التنبيهات">🔔<span id="notificationCount" hidden>0</span></button>
          <time id="clock" aria-live="off"></time>
        </div>
      </header>

      <div id="importStatus" class="notice" role="status" aria-live="polite" hidden></div>

      <section id="app" tabindex="-1" aria-live="polite">
        <noscript>
          <div class="notice error">يلزم تفعيل JavaScript لتشغيل منصة الاعتماد والجودة.</div>
        </noscript>
      </section>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="formTitle">
    <form method="dialog" id="form">
      <header class="modal-header">
        <h3 id="formTitle">إضافة سجل</h3>
        <button type="button" id="closeModal" aria-label="إغلاق">×</button>
      </header>
      <div id="fields" class="modal-fields"></div>
      <footer>
        <button type="button" id="cancelModal" class="secondary">إلغاء</button>
        <button type="submit" id="save" value="default">حفظ</button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <h3 id="confirmTitle">تأكيد الإجراء</h3>
      <p id="confirmMessage"></p>
      <footer>
        <button value="cancel" class="secondary">إلغاء</button>
        <button id="confirmAction" value="default" class="danger">تأكيد</button>
      </footer>
    </form>
  </dialog>

  <template id="loadingTemplate">
    <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span><span>جارٍ تحميل البيانات…</span></div>
  </template>

  <script src="app.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('menuToggle');
      const modal = document.getElementById('modal');
      const closeModal = document.getElementById('closeModal');
      const cancelModal = document.getElementById('cancelModal');

      toggle?.addEventListener('click', function () {
        const opened = document.body.classList.toggle('menu-open');
        toggle.setAttribute('aria-expanded', String(opened));
      });

      document.getElementById('nav')?.addEventListener('click', function (event) {
        const button = event.target.closest('button[data-page]');
        if (!button) return;
        this.querySelectorAll('button').forEach(item => {
          item.classList.toggle('active', item === button);
          item.removeAttribute('aria-current');
        });
        button.setAttribute('aria-current', 'page');
        document.body.classList.remove('menu-open');
        toggle?.setAttribute('aria-expanded', 'false');
      });

      closeModal?.addEventListener('click', () => modal?.close('cancel'));
      cancelModal?.addEventListener('click', () => modal?.close('cancel'));

      window.addEventListener('keydown', event => {
        if (event.key === 'Escape') document.body.classList.remove('menu-open');
      });
    });
  </script>
</body>
</html>
